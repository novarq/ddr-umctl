# This memory map is for the Alliance AS4C1G16D4 device:
# - Density : 16G bits
# - Organization : 128M words x 16 bits x 8 banks
#  - Bank Address:   BA0 ~ BA1
#  - Bank Group:     BG0
#  - Row Address:    A0 ~ A16
#  - Column Address: A0 ~ A9
#  - Page size:      2 KB
# You can use this for other devices with the same organization
# It will also work with inline ECC enabled (2 BG rotation)
---
addrmap0:
  ADDRMAP_CS_BIT0: 31
addrmap1:
  ADDRMAP_BANK_B0: 9
  ADDRMAP_BANK_B1: 9
  ADDRMAP_BANK_B2: 63
addrmap2:
  ADDRMAP_COL_B2: 0
  ADDRMAP_COL_B3: 7
  ADDRMAP_COL_B4: 0
  ADDRMAP_COL_B5: 0
addrmap3:
  ADDRMAP_COL_B6: 0
  ADDRMAP_COL_B7: 0
  ADDRMAP_COL_B8: 0
  ADDRMAP_COL_B9: 0
addrmap4:
  ADDRMAP_COL_B10: 31
  ADDRMAP_COL_B11: 31
addrmap5:
  ADDRMAP_ROW_B0: 7
  ADDRMAP_ROW_B1: 7
  ADDRMAP_ROW_B2_10: 7
  ADDRMAP_ROW_B11: 7
addrmap6:
  ADDRMAP_ROW_B12: 7
  ADDRMAP_ROW_B13: 7
  ADDRMAP_ROW_B14: 7
  ADDRMAP_ROW_B15: 7
addrmap7:
  ADDRMAP_ROW_B16: 7
  ADDRMAP_ROW_B17: 15
addrmap8:
